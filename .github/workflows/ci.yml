name: CI

# The public pipeline: nonagenticai/ci-workflows/python-service.yml on GitHub-hosted runners,
# with no repository secrets, publishing ghcr.io/nonagenticai/coding-testing from main.
#
# There is no deploy job. Flux watches the ImagePolicy for this service and rolls it when the
# image changes — the repo never holds cluster credentials.
#
# While this repository was private it ran the private deployment archetype; that job is gone
# rather than gated because GitHub parses a called workflow even when the calling job's `if:`
# is false, so a public repository that keeps a private `uses:` cannot dispatch CI at all.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: nonagenticai/ci-workflows/.github/workflows/python-service.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image_name: coding-testing
      src_dir: src
      # Test results + orchestration state live in Postgres (2-replica safety).
      # The workflow spins up a per-job ephemeral postgres:18, exports DATABASE_URL,
      # and runs `alembic upgrade head` before pytest.
      has_postgres: true
      alembic: true
      # Cold rebuilds under runner contention crossed the old 30-min cap before;
      # a cancelled check reports as *pending* rather than red.
      build_timeout_minutes: 45
      # coding-testing boots without a live DB; ENABLE_AUTH=false + ENVIRONMENT=testing
      # is all /health needs (redis is optional at boot).
      build_smoke: |
        docker run -d --name smoke-coding-testing \
          -e ENABLE_AUTH=false \
          -e ENVIRONMENT=testing \
          -e REDIS_URL=redis://localhost:6379/0 \
          -p 18689:8689 "$IMAGE_REF"
        ok=0
        for i in $(seq 1 30); do
          if curl -sf http://localhost:18689/health >/dev/null 2>&1; then
            echo "health ok (attempt $i)"; ok=1; break
          fi
          sleep 1
        done
        docker logs smoke-coding-testing || true
        docker rm -f smoke-coding-testing || true
        [ "$ok" -eq 1 ]
